<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTMA prototype · Effectory</title>
  <!-- The prototype opens where the demo starts: the surveys list. The two
       measurements sit at the top of it, the results are one click away, and
       Create survey walks into the setup flow. -->
  <script src="proto-config.js"></script>
  <script src="toolbar/load.js"></script>
  <script>
    /* The toolbar's loader is synchronous, so ProtoToolbar is here either way:
       the bar itself on a colleague link, its defaults on a tester's. A start
       page chosen in the bar wins over the surveys list, which is what
       startPath is for, and carry keeps the flag on the way there. */
    (function () {
      var to = ProtoToolbar.startPath() || 'surveys.html';
      location.replace(ProtoToolbar.carry(to));
    })();
  </script>
</head>
<body>
  <p style="font-family: system-ui, sans-serif; margin: 48px;">
    <a href="surveys.html">Ga naar de Surveys-pagina</a>
  </p>
</body>
</html>
