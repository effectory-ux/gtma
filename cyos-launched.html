  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("effx-theme")||"light")}catch(e){}</script>
  <style>
    body { background: var(--bg-base); }

    /* Components that set their own display beat the browser's [hidden] rule, and this
       screen toggles a lot of them. One rule instead of chasing them one by one. */
    [hidden] { display: none !important; }

    /* .tt-demo in components.css is the docs wrapper and shows the bubble permanently.
       Gate it on hover, the same three lines the other prototypes here carry. */
    .tt-demo { position: relative; display: inline-flex; }
    /* The bubble is placed in a fixed layer on hover. Parking it there from the start
       too keeps an idle tooltip from widening whatever box it sits in: absolutely
       positioned, it still counted towards the scroll width and gave the Select groups
       dialog a horizontal scrollbar. */
    .tt-demo .tooltip { position: fixed; left: 0; top: 0; opacity: 0; pointer-events: none; transition: opacity var(--motion-fast) var(--ease-out); }
    /* The tooltip inherits white-space from whatever it sits in, and the toggle label
       here is nowrap to keep "Random sample" on one line. Without this the bubble can't
       wrap and its text gets cut off at the 240px max-width. */
    .tooltip { white-space: normal; }
    .tt-demo:hover .tooltip, .tt-demo:focus-within .tooltip { opacity: 1; }

    /* ══ CYOS shell ══
       The same shell as the questionnaire screen in this repo, which is also the one
       the live app uses: logo bar, four-step rail, 1000px column, fixed action bar. */
    .cyos { display: flex; flex-direction: column; min-height: 100vh; }
    .cyos-main { flex: 1; padding: var(--spacing-extra-loose) var(--spacing-loose) 120px; }
    .cyos-inner { max-width: 1000px; margin-inline: auto; }

    /* The name bar stays put while you scroll, so you always see which survey you
       are setting up. The stepper scrolls with the page underneath it. */
    .cyos-head { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; height: 65px; padding: var(--spacing-base-tight) var(--spacing-base); background: var(--bg-base); border-bottom: 1px solid var(--border-base); }
    .cyos-logo { width: 40px; height: 40px; flex-shrink: 0; margin-right: var(--spacing-base); }
    .cyos-name-group { display: flex; align-items: center; gap: var(--spacing-tight); min-width: 0; }
    .cyos-name-group i[data-icon] { width: 16px; height: 16px; display: flex; flex-shrink: 0; color: var(--content-secondary); }
    .cyos-survey-name { margin: 0; color: var(--content-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cyos-head-actions { margin-left: auto; display: flex; align-items: center; gap: var(--spacing-tight); }

    /* The rail is wider than the content column and spreads its steps: max 1300px,
       centred, space-between, 24px gutters. The hairline belongs to the bar around it,
       so it runs the full width. */
    /* The rail sticks under the name bar instead of disappearing behind it, so the
       two read as one header. */
    .cyos-steps-bar { position: sticky; top: 65px; z-index: 15; padding: 12px 0; background: var(--bg-base); border-bottom: 1px solid var(--border-base); overflow-x: auto; }
    .cyos-steps { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-loose); max-width: 1300px; margin-inline: auto; padding: 0 var(--spacing-loose); }
    .cyos-step { display: flex; align-items: center; gap: var(--spacing-base-tight); padding: var(--spacing-extra-tight) var(--spacing-base); border: none; background: transparent; border-radius: var(--radius-base); font-family: inherit; text-align: left; cursor: pointer; }
    .cyos-step:hover { background: var(--bg-base-hover); }
    .cyos-step-badge { flex-shrink: 0; display: flex; align-items: center; }
    .cyos-step-circle { position: relative; z-index: 2; width: 28px; height: 28px; margin-right: -4px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-base); border-radius: var(--radius-full); background: var(--bg-secondary-hover); color: var(--content-secondary); font-size: 14px; font-weight: 500; }
    .cyos-step-circle i { width: 16px; height: 16px; display: flex; }
    .cyos-step-tile { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--bg-secondary-hover); color: var(--content-secondary); }
    .cyos-step-tile i { width: 24px; height: 24px; display: flex; }
    .cyos-step.is-done .cyos-step-circle { background: var(--bg-positive); color: var(--content-on-brand-base); border-color: var(--bg-base); }
    .cyos-step.is-active .cyos-step-circle,
    .cyos-step.is-active .cyos-step-tile { background: var(--bg-brand-subtle-selected); }
    .cyos-step.is-active .cyos-step-circle { color: var(--content-brand-secondary); }
    .cyos-step.is-active .cyos-step-tile { color: var(--content-brand-secondary); }
    /* Every page renders this rail from scratch, and the subtitles differ per step and
       per state. Fixing the step width and reserving two subtitle lines keeps the bar
       identical from page to page, so it no longer shifts on navigation. */
    .cyos-step { width: 262px; }
    .cyos-step-body { min-width: 0; flex: 1; }
    .cyos-step-title { white-space: nowrap; }
    .cyos-step-sub { min-height: 2.6em; }
    .cyos-step-title { margin: 0; color: var(--content-secondary); }
    .cyos-step.is-active .cyos-step-title { color: var(--content-base); }
    .cyos-step-sub { margin: 0; color: var(--content-secondary); }
    .cyos-step-sep { display: flex; align-items: center; color: var(--content-subtle); }
    .cyos-step-sep i { width: 16px; height: 16px; display: flex; }

    .cyos-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; gap: var(--spacing-base-tight); padding: var(--spacing-base) var(--spacing-loose); background: var(--bg-base); border-top: 1px solid var(--border-base); box-shadow: var(--sh-footer); }
    .cyos-foot-right { margin-left: auto; display: flex; align-items: center; gap: var(--spacing-base-tight); }
    .cyos-saved { font-size: 14px; color: var(--content-secondary); }
    /* The live app title-cases these labels in CSS, so the source strings stay sentence case. */
    .cyos-foot .btn { text-transform: capitalize; }

    /* ══ Survey planned ══
       The closing screen: no rail and no action bar, just the confirmation and
       the way back to the overview. */
    /* Nothing else on the screen, so the confirmation takes the whole height. */
    .done-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--spacing-extra-loose) var(--spacing-loose) 80px; text-align: center; }
    .done-art-wrap { position: relative; width: 268px; height: 268px; }
    .done-art { position: relative; width: 268px; height: 268px; display: block; }
    .done-title { margin: var(--spacing-super-extra-loose) 0 var(--spacing-tight); font-size: 26px; font-weight: 600; line-height: 1.3; color: var(--content-base); }
    .done-sub { margin: 0 0 var(--spacing-extra-loose); font-size: 14px; color: var(--content-secondary); }

    /* The screen arrives in one go: the artwork settles in, a ring rides out from
       behind it, and the three lines follow one after the other. */
    .done-art { animation: done-pop var(--motion-slow) var(--ease-out) both; }
    .done-art-wrap::before {
      content: ''; position: absolute; top: 24px; left: 24px; width: 220px; height: 220px;
      border-radius: var(--radius-full); background: var(--bg-highlight-base);
      animation: done-ring 900ms var(--ease-out) 120ms both;
    }
    .done-title { animation: done-rise var(--motion-base) var(--ease-out) 160ms both; }
    .done-sub   { animation: done-rise var(--motion-base) var(--ease-out) 240ms both; }
    .done-wrap .btn { animation: done-rise var(--motion-base) var(--ease-out) 320ms both; }

    @keyframes done-pop  { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
    @keyframes done-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes done-ring { from { opacity: .35; transform: scale(.8); } to { opacity: 0; transform: scale(1.3); } }

    @media (prefers-reduced-motion: reduce) {
      .done-art, .done-title, .done-sub, .done-wrap .btn, .done-art-wrap::before { animation: none; }
      .done-art-wrap::before { display: none; }
    }
  </style>
  <!-- The scripts that translate this page sit at the end of the body, and a
       blocking script halfway down lets the browser paint what it has before it
       gets there. In English there is nothing to wait for; in another language
       that first paint is the wrong one, so hold it back until the text has been
       swapped. The timeout is the failsafe: a page always shows itself. -->
  <script>try{if((localStorage.getItem('effx-lang')||'en')!=='en'){document.documentElement.classList.add('gtma-lang-wait');setTimeout(function(){document.documentElement.classList.remove('gtma-lang-wait')},2000)}}catch(e){}</script>
  <style>html.gtma-lang-wait body { visibility: hidden; }</style>
<body>
    
<div class="cyos">


  <div class="done-wrap">
    <span class="done-art-wrap"><img class="done-art" src="assets/img/survey-ready.svg" alt="" /></span>
    <h1 class="done-title" id="doneTitle">Your survey is ready for take off!</h1>
    <p class="done-sub" id="doneSub"></p>
    <a class="btn btn-primary" href="survey-detail.html">Go back to Surveys</a>
  </div>

</div>

<script src="https://effectory-ux.github.io/Engage-Design-system-/icons.js"></script>
<script src="gtma-icons.js"></script>
<script>
/* What the survey period settled on, so the line underneath says when it starts. */
var PERIOD = (function () {
  try { return JSON.parse(sessionStorage.getItem('gtma-cyos-period')); } catch (e) { return null; }
})();
var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

var sub = 'Your survey will start shortly';
if (PERIOD && PERIOD.when === 'now') {
  sub = 'Your survey starts right away';
} else if (PERIOD && PERIOD.start) {
  var d = new Date(PERIOD.start);
  sub = 'Your survey will start on ' + WD[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}
document.getElementById('doneSub').textContent = sub;

if (window.Icons) window.Icons.render(document.body);
</script>

<!-- One language for the whole prototype: the design system's map for what these
     screens share with the dashboard, this prototype's own for the rest. -->
<script src="https://effectory-ux.github.io/Engage-Design-system-/i18n.js"></script>
<script src="gtma-strings.js"></script>
<script src="gtma-i18n.js"></script>
</body>
