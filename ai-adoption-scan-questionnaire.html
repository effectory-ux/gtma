<!DOCTYPE html>
<html lang="en">
<head>

    body { background: var(--bg-interface-body); }

    /* This screen has NO main navigation — the CYOS flow replaces the app shell with
       its own header + stepper and a footer action bar. Content column is 1000px. */
    .cyos { display: flex; flex-direction: column; min-height: 100vh; }
    .cyos-main { flex: 1; padding: var(--spacing-extra-loose) var(--spacing-loose) 120px; }
    .cyos-inner { max-width: 1000px; margin-inline: auto; }

    /* ── Header ──
       65px, white, hairline bottom border. Logo is the design-system Effectory mark
       (assets/illustrations/logo/effectory-logo.svg — the same artwork .mn-logo uses). */
    .cyos-head { display: flex; align-items: center; height: 65px; padding: var(--spacing-base-tight) var(--spacing-base); background: var(--bg-base); border-bottom: 1px solid var(--border-base); }
    .cyos-logo { width: 40px; height: 40px; flex-shrink: 0; margin-right: var(--spacing-base); }
    .cyos-name-group { display: flex; align-items: center; gap: var(--spacing-tight); min-width: 0; }
    .cyos-name-group i[data-icon] { width: 16px; height: 16px; display: flex; flex-shrink: 0; color: var(--content-secondary); }
    .cyos-survey-name { margin: 0; color: var(--content-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cyos-head-actions { margin-left: auto; display: flex; align-items: center; gap: var(--spacing-tight); }

    /* ── Stepper ──
       Each step is a 28px circle that overlaps a 44px icon tile by 4px. The circle
       carries the step number while pending and a check once done; its 2px white
       border is what makes it read as sitting on top of the tile. */
    .cyos-steps { display: flex; align-items: center; justify-content: center; padding: var(--spacing-base-tight) var(--spacing-base); border-bottom: 1px solid var(--border-base); overflow-x: auto; }
    .cyos-step { display: flex; align-items: center; gap: var(--spacing-base-tight); padding: var(--spacing-extra-tight) var(--spacing-base); border: none; background: transparent; border-radius: var(--radius-base); font-family: inherit; text-align: left; cursor: pointer; }
    .cyos-step:hover { background: var(--bg-base-hover); }
    .cyos-step-badge { flex-shrink: 0; display: flex; align-items: center; }
    .cyos-step-circle { position: relative; z-index: 2; width: 28px; height: 28px; margin-right: -4px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-base); border-radius: var(--radius-full); background: var(--bg-secondary-hover); color: var(--content-secondary); font-size: 14px; font-weight: 500; }
    .cyos-step-circle i { width: 16px; height: 16px; display: flex; }
    .cyos-step-tile { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--bg-secondary-hover); color: var(--content-secondary); }
    .cyos-step-tile i { width: 24px; height: 24px; display: flex; }
    /* done, but not the step you're on: positive fill + white check */
    .cyos-step.is-done .cyos-step-circle { background: var(--bg-positive); color: var(--content-on-brand-base); border-color: var(--bg-base); }
    /* the step you're on: brand-selected fill on both, brand-secondary icon */
    .cyos-step.is-active .cyos-step-circle,
    .cyos-step.is-active .cyos-step-tile { background: var(--bg-brand-subtle-selected); }
    .cyos-step.is-active .cyos-step-circle { color: var(--content-brand-secondary); }
    .cyos-step.is-active .cyos-step-tile { color: var(--content-brand-secondary); }
    .cyos-step-body { min-width: 0; }
    .cyos-step-title { margin: 0; color: var(--content-secondary); }
    .cyos-step.is-active .cyos-step-title { color: var(--content-base); }
    .cyos-step-sub { margin: 0; color: var(--content-secondary); }
    .cyos-step-sep { display: flex; align-items: center; color: var(--content-subtle); }
    .cyos-step-sep i { width: 16px; height: 16px; display: flex; }

    /* ── Template card ── */
    .cyos-title { margin: 0 0 var(--spacing-loose); color: var(--content-base); }
    .tmpl-card { padding: var(--spacing-loose); margin-bottom: var(--spacing-extra-loose); }
    .tmpl-card-top { display: flex; align-items: center; gap: var(--spacing-base); }
    .tmpl-card-top img { width: 64px; height: 64px; flex-shrink: 0; }
    .tmpl-card-name { margin: 0; color: var(--content-base); }
    .tmpl-card-meta { margin: var(--spacing-extra-tight) 0 0; color: var(--content-secondary); }
    /* the "locked" strip under the card — a standard template can't be edited here */
    .tmpl-locked { margin-top: var(--spacing-base); padding: var(--spacing-base-tight) var(--spacing-base); background: var(--bg-secondary); border-radius: var(--radius-base); color: var(--content-secondary); text-align: center; }

    /* ── Questionnaire (same block as the template preview dialog) ── */
    .q-head { display: flex; align-items: center; gap: var(--spacing-base-tight); margin-bottom: var(--spacing-base-tight); }
    .q-head h2 { margin: 0; color: var(--content-base); }
    .q-count { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 var(--spacing-tight); background: var(--bg-tertiary); color: var(--content-base); border-radius: var(--radius-full); font-size: 12px; font-weight: 600; }
    .q-topic + .q-topic { margin-top: var(--spacing-extra-loose); }
    .q-list { background: var(--bg-base); border: 1px solid var(--border-base); border-radius: var(--radius-md); overflow: hidden; }
    .q-row { display: flex; align-items: center; gap: var(--spacing-super-loose); padding: var(--spacing-base) var(--spacing-loose); border-bottom: 1px solid var(--border-base); }
    .q-row:last-child { border-bottom: none; }
    .q-text { flex: 1; min-width: 0; color: var(--content-base); }
    .q-scale { flex-shrink: 0; display: flex; align-items: center; gap: var(--spacing-tight); width: 168px; color: var(--content-base); }
    .q-scale-icon { flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); }
    .q-scale-icon i { width: 16px; height: 16px; display: flex; }
    .q-scale-icon.is-scale  { background: var(--bg-brand-subtle);         color: var(--content-accent-turquoise); }
    .q-scale-icon.is-choice { background: var(--bg-accent-yellow-subtle); color: var(--content-accent-yellow); }
    .q-scale-icon.is-open   { background: var(--bg-accent-orange-subtle); color: var(--content-accent-orange); }
    .q-scale-icon.is-nps    { background: var(--bg-accent-blue-subtle);   color: var(--content-accent-blue); }
    .q-scale-icon.is-yesno  { background: var(--bg-accent-green-subtle);  color: var(--content-accent-green); }
    .q-scale-icon.is-single { background: var(--bg-accent-green-subtle); color: var(--content-accent-green); }
    .q-list .tag.is-standard { flex-shrink: 0; background: var(--bg-brand-subtle); color: var(--content-accent-turquoise); }

    /* ── Footer action bar ── */
    .cyos-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-base-tight); padding: var(--spacing-base) var(--spacing-loose); background: var(--bg-base); border-top: 1px solid var(--border-base); box-shadow: var(--sh-footer); }

    @media (max-width: 900px) {
      .cyos-steps { justify-content: flex-start; }
      .cyos-step-sub { display: none; }
      .q-scale { width: auto; }
      .q-scale span:last-child { display: none; }
    }
  </style>
</head>

          </div>
        </div>
        <div class="text-medium tmpl-locked">You are not able to change or edit questions in this template</div>
      </div>

      <div id="questionnaire"></div>
    </div>
  </main>

  <!-- FOOTER ACTIONS -->
  <div class="cyos-foot">
    <button class="btn btn-secondary" data-saveclose>Save &amp; Close</button>
    <button class="btn btn-primary">Next Step <i data-icon="arrow-right"></i></button>
    <button class="btn btn-primary is-disabled" disabled>Review &amp; Plan <i data-icon="send"></i></button>
  </div>

</div>

    "Diversity, Equity & Inclusion (DEI)": { img: "dei-template", meta: "Standard template \u00b7 44 questions \u00b7 8 minutes" },
    "Smart Organization Scan - Pulse": { img: "sos-template", meta: "Standard template \u00b7 9 questions \u00b7 2 minutes" },
    "Smart Organization Scan - Survey": { img: "sos-template", meta: "Standard template \u00b7 34 questions \u00b7 6 minutes" },
    "Psychological Risk Assessment": { img: "psa-template", meta: "Standard template \u00b7 10 questions \u00b7 2 minutes" },
    "ESG Scan": { img: "esg-template", meta: "Standard template \u00b7 31 questions \u00b7 7 minutes" }
  };

  /* Which survey this screen is showing. The create flow hands these over on the URL:
     ?template=<template name>&name=<survey name>. Defaults keep the file useful on its own. */
  var params = new URLSearchParams(location.search);
  var templateName = params.get('template') || 'AI Adoption Scan';
  var surveyName = params.get('name') || 'AI Adoption Scan 2026';
  /* Where the create flow started, carried over by create-survey-dialog. "Save & Close"
     drops the user back on that overview — All surveys, or the Projects overview when the
     flow began inside a project (there is no project-detail reference screen yet). */
  var RETURN_TO = 'ai-adoption-scan-template-dialog.html';
  if (!QUESTIONNAIRES[templateName]) templateName = 'AI Adoption Scan';
  var meta = TEMPLATE_META[templateName];

  var SCALE_TYPES = {
    scale:  ['point-scale', '5-point scale'],
    choice: ['check-square', 'Multiple choice'],
    open:   ['text-entry', 'Open-ended question'],
    nps:    ['net-promoter-score', '0\u201310 scale'],
    yesno:  ['single-answer', 'Yes / No'],
    single: ['single-answer', 'Single choice']
  };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* The four setup steps. Every step is optional and pre-filled, so "Layout & emails"
     is done from the start; coming from a template the questions are already chosen
     and fixed, so "Questions" is done too. Set done:false to see the pending state. */
  var STEPS = [
    { title: 'Questions',       icon: 'check-square', sub: '', done: true,  active: true },
    { title: 'Participants',    icon: 'users',        sub: 'Select participants', done: false, active: false },
    { title: 'Survey period',   icon: 'calendar',     sub: 'Select period',       done: false, active: false },
    { title: 'Layout &amp; emails', icon: 'layout',   sub: 'Survey: Effectory default<br />Email: Effectory default', done: true, active: false }
  ];

  document.getElementById('steps').innerHTML = STEPS.map(function (st, i) {
    var cls = 'cyos-step' + (st.active ? ' is-active' : '') + (st.done ? ' is-done' : '');
    // done → check, otherwise the step number
    var badge = st.done ? '<i data-icon="check"></i>' : (i + 1);
    return (i ? '<span class="cyos-step-sep"><i data-icon="chevron-right"></i></span>' : '') +
      '<button class="' + cls + '"' + (st.active ? ' aria-current="step"' : '') + '>' +
        '<span class="cyos-step-badge">' +
          '<span class="cyos-step-circle">' + badge + '</span>' +
          '<span class="cyos-step-tile"><i data-icon="' + st.icon + '"></i></span>' +
        '</span>' +
        '<span class="cyos-step-body">' +
          '<p class="text-l5 cyos-step-title">' + st.title + '</p>' +
          (st.sub ? '<p class="text-small text-w500 cyos-step-sub">' + st.sub + '</p>' : '') +
        '</span>' +
      '</button>';
  }).join('');

  document.getElementById('surveyName').textContent = surveyName;
  document.getElementById('tmplName').textContent = templateName;
  document.getElementById('tmplMeta').textContent = meta.meta;
  document.getElementById('tmplImg').src = 'https://effectory-ux.github.io/Engage-Design-system-/assets/illustrations/templates/' + meta.img + '.svg';
  document.title = surveyName + ' \u2014 Questions';

  // the Questions step summarises the template: "N questions \u00b7 N mins"
  var counts = meta.meta.match(/(\d+)\s+questions.*?(\d+)\s+minutes/);
  if (counts) {
    var qStep = document.querySelector('.cyos-step .cyos-step-body');
    var sub = document.createElement('p');
    sub.className = 'text-small text-w500 cyos-step-sub';
    sub.textContent = counts[1] + ' questions \u00b7 ' + counts[2] + ' mins';
    qStep.appendChild(sub);
  }

  // Questionnaire — one card of rows per section, headed by the section + a count pill
  document.getElementById('questionnaire').innerHTML = QUESTIONNAIRES[templateName].map(function (sec) {
    return '<div class="q-topic">' +
      '<div class="q-head">' +
        '<h2 class="text-l5">' + esc(sec[0]) + '</h2>' +
        '<span class="q-count">' + sec[1].length + '</span>' +
      '</div>' +
      '<div class="q-list">' +
        sec[1].map(function (q) {
          var t = SCALE_TYPES[q[1]] || SCALE_TYPES.scale;
          return '<div class="q-row">' +
            '<div class="text-medium text-w500 q-text">' + esc(q[0]) + '</div>' +
            '<div class="text-medium q-scale">' +
              '<span class="q-scale-icon is-' + q[1] + '"><i data-icon="' + t[0] + '"></i></span>' +
              '<span>' + esc(t[1]) + '</span>' +
            '</div>' +
            '<span class="tag is-standard">Standard</span>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  // Save & Close — leave the survey as a draft and go back where you came from.
  // Nothing is persisted; the draft already exists from the moment it was created.
  document.querySelector('[data-saveclose]').addEventListener('click', function () {
    location.href = RETURN_TO;
  });

  if (window.Icons) window.Icons.render();
</script>
</body>
</html>
